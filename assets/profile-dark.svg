      <stop offset="1" stop-color="#75eed0"/>
    </linearGradient>
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#473961"/>
    </pattern>
    <clipPath id="frame">
      <rect x="1" y="1" width="998" height="350" rx="25"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
