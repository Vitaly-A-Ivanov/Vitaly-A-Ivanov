<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="352" viewBox="0 0 1000 352" role="img" aria-labelledby="title description">
  <title id="title">Vitaliy, software engineer</title>
  <desc id="description">An abstract circuit diagram with a violet hub and branching paths, alongside the name Vitaliy.</desc>
  <defs>
    <linearGradient id="background" x2="100%" y2="100%" gradientUnits="objectBoundingBox">
      <stop stop-color="#181126"/>
      <stop offset="1" stop-color="#272042"/>
    </linearGradient>
    <linearGradient id="signal" x1="0%" y1="100%" x2="100%" y2="0%">
